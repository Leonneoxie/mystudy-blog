<script type="application/json" id="blogSearchData">[{"title": "投机解码真正难在接受规则与状态回滚", "summary": "从 draft、verify、accept 三步解释投机解码，并梳理 KV Cache、采样状态和停止条件的回滚契约。", "category": "推理系统", "tags": ["Speculative Decoding", "Sampling", "KV Rollback"], "series": "推理框架核心技术", "date": "2026-07-31", "href": "posts/speculative-decoding-contract.html", "text": " 一句话结论 投机解码通过便宜 proposer 一次提出多个 token，再由目标模型并行验证；是否加速取决于接受率和验证成本，而正确性取决于接受规则及所有请求状态能否一致回滚。 三步执行 text draft: 提议 d1 d2 d3 d4 verify: 目标模型一次计算这些位置的分布 accept: 接受前缀，遇到拒绝点改由目标分布采样 如果平均每次验证能接受多个 token，目标模型 forward 次数可能减少。但 proposer 太重、接受率太低或 batch 调度不匹配时，投机路径反而更慢。 为什么不能只比较 greedy 输出 Greedy 模式下可直接检查 draft token 是否等于目标模型 argmax；随机采样需要遵循修正后的分布，才能保持与目标分布一致。错误的“匹配就收、不匹配就重采”可能改变总体采样分布。 回滚对象 拒绝发生后，需要一致处理： - 已预留但未接受的 KV token； - 序列长度和 block table； - RNG/采样状态； - repetition/frequency penalty 历史； - stop string 与结构化解码状态； - 流式输出缓冲区。 如果 token 已经发送给客户端，就不能再静默撤回。因此验证应先于外部可见提交。 最小实验设计 使用 n-gram proposer 可以在不加载第二个模型的情况下验证控制流：从请求已有 token 中查找相同后缀并提出后续 token。分别构造高重复文本和随机文本，预期前者接受率更高。这个实验验证机制和退化条件，不代表 draft model 或 EAGLE 的真实收益。 必须报告的指标 - 平均接受 token 数； - 接受率分布，而不只是均值； - proposer、verify 和 rollback 时间； - 端到端 TPOT 与吞吐； - 低接受率 workload 的反例； - 开启前后输出分布或确定性对拍。 参考资料 - Fast Inference from Transformers via Speculative Decoding https://arxiv.org/abs/2211.17192 - vLLM Speculative Decoding https://docs.vllm.ai/ 资料核验日期：2026-08-01。 "}, {"title": "Prefix Cache 与 RadixAttention：复用前缀不只是做哈希", "summary": "比较块哈希缓存和 radix tree 前缀缓存，说明命中、引用、驱逐和 cache-aware scheduling 的系统联系。", "category": "推理系统", "tags": ["Prefix Cache", "RadixAttention", "SGLang"], "series": "推理框架核心技术", "date": "2026-07-31", "href": "posts/prefix-cache-radix-attention.html", "text": " 问题背景 系统提示词、长文档模板和多轮会话经常重复。若每个请求都重新 Prefill，相同前缀会重复消耗计算。前缀缓存保存已经计算的 KV，并在新请求到达时复用最长匹配部分。 一句话结论 块哈希缓存适合用固定 block 表达和查找共享前缀；radix tree 能表达任意粒度的公共路径。真正困难的不是“找到命中”，而是让匹配、引用计数、驱逐和调度保持一致。 两种表示 text Block hash: hash tokens 0:16 - physical block 7 Radix tree: system prompt ├── user A history └── user B history 哈希方案通常按完整块复用，数据结构简单，并与 Paged KV 自然结合。Radix tree 可以在共享路径上分叉，更适合复杂前缀集合，但树的拆分、合并和驱逐更复杂。 缓存键必须包含什么 仅使用 token IDs 可能不够。模型版本、adapter、位置编码条件、图像特征或影响 KV 的配置变化都可能使缓存失效。缓存键漏掉条件会产生“命中但输出错误”的危险问题。 调度为何要感知缓存 如果队列中两个请求分别命中 10% 和 90% 的前缀，优先处理高命中请求可能减少 Prefill 工作量、提高吞吐；但长期只追求命中率会伤害公平性。Cache-aware scheduling 必须在复用收益、等待时间和优先级之间取舍。 驱逐与引用 正在被运行请求引用的节点不能驱逐；空闲节点可以按 LRU 或成本策略回收。前缀树节点和物理 KV block 的生命周期必须同步，否则会出现悬空映射或泄漏。 验收清单 1. 相同前缀命中后，输出与无缓存路径一致。 2. 只差一个 token 的请求在正确位置分叉。 3. 不同模型或 adapter 不发生错误共享。 4. 驱逐后物理块计数恢复。 5. 命中率提升同时报告公平性和尾延迟。 本篇为源码结构和状态机说明，不包含 GPU 性能实测。 参考资料 - SGLang 官方文档 https://docs.sglang.ai/ - vLLM Automatic Prefix Caching https://docs.vllm.ai/ 资料核验日期：2026-07-31。 "}, {"title": "mini-infer 为什么把推理引擎拆成四个边界", "summary": "复盘教学型推理框架如何划分请求状态、调度、KV Cache 和模型执行，并解释哪些生产能力不应硬塞进主循环。", "category": "项目复盘", "tags": ["mini-infer", "Architecture", "Inference Engine"], "series": "项目复盘", "date": "2026-07-31", "href": "posts/mini-infer-architecture.html", "text": " 项目目标 mini-infer 的目标不是成为 vLLM 或 SGLang 的轻量替代品，而是让学习者能沿着一条清晰路径理解现代推理引擎：先跑通自回归循环，再加入分页 KV、连续批处理、缓存、投机解码、量化、分布式和多模态边界。 一句话结论 教学框架最重要的设计不是 feature 数量，而是让请求状态、调度决策、缓存生命周期和模型执行保持可观察、可替换、可单独验证。 四个核心边界 text Request / Sequence State ↓ Scheduler ←→ KV Cache Manager ↓ ↓ Model Runner / Attention Backend 请求状态 请求对象保存 token、生成限制、采样配置、完成原因和每请求随机状态。它不能依赖当前 batch index，否则连续批处理重排后，同一请求的行为会漂移。 调度器 调度器只决定本轮谁运行、处理多少 token，以及资源不足时等待、抢占还是重算。它不应直接实现注意力计算，也不应绕过缓存管理器修改物理块。 KV Cache 管理器 缓存管理器负责 block 分配、引用、共享、回收和回滚。调度器可以询问预算，但物理生命周期必须有唯一真相源，否则取消、投机拒绝和前缀共享很容易产生泄漏。 模型执行器 Model runner 把调度结果整理成张量和 attention metadata，调用 PyTorch、FlashInfer 或其他 backend。Kernel 选择属于执行层；它不能反向决定业务请求是否完成。 为什么不能把所有前沿能力塞进一个 Engine.step 结构化输出可以约束采样状态，LoRA 会影响权重和缓存键，P/D 分离需要跨 worker 传递 KV，全模态生成甚至包含 diffusion 和 codec。若这些能力都通过条件分支堆进主循环，教学主线会迅速失去边界。 mini-infer 的取舍是：文本推理通用机制进入主线；VLM encoder/projector 作为边界扩展；完整图像、音频和视频生成保留为独立 omni pipeline 课程。未覆盖不等于缺陷，而是明确产品范围。 如何验收架构而不只是输出 1. 调度器测试不加载真实模型，也能复现请求状态转换。 2. KV 管理测试能在完成、取消和回滚后恢复全部块。 3. Model runner 能替换 reference backend 与真实 kernel backend。 4. 固定请求 trace 可以重放，比较输出和调度事件。 5. benchmark 同时记录 TTFT、TPOT、吞吐、显存和失败条件。 这些测试分别建立控制面、资源面和数据面的证据。只有单请求文本正确，不能证明它已经是可靠的推理系统。 当前边界 mini-infer 已覆盖核心机制和若干真实 backend 教学入口，但生产级容错、大规模 MoE/EP、完整 P/D 基础设施与 Omni 异构流水仍应按“概念、原型、真实后端、性能验证”四级标注，不能用同名 feature 混淆完成度。 延伸学习 建议按 L01 → L02 → L03 → L04 阅读：先建立执行循环，再理解 Paged KV、Continuous Batching 和缓存/抢占。完成后再进入投机解码、真实 kernel、量化和分布式章节。 参考资料 - vLLM 官方文档 https://docs.vllm.ai/en/stable/ - SGLang 官方文档 https://docs.sglang.ai/ - vLLM-Omni 官方仓库 https://github.com/vllm-project/vllm-omni 资料核验日期：2026-08-04。 "}, {"title": "vLLM、SGLang 与 vLLM-Omni 应该如何比较", "summary": "不用功能数量排名，而是从执行对象、缓存调度、扩展规模和多模态阶段四个维度建立框架选型方法。", "category": "框架观察", "tags": ["vLLM", "SGLang", "vLLM-Omni"], "series": "推理框架核心技术", "date": "2026-07-31", "href": "posts/inference-framework-comparison.html", "text": " 先说结论 三个项目不能只用同一张功能勾选表排名。vLLM 面向广覆盖的模型服务运行时，SGLang 强调前缀复用、调度和大规模服务能力，vLLM-Omni 则把问题扩展到文本、图像、音频、视频等异构阶段流水线。选型应从 workload 和运维边界出发。 四个比较维度 维度 vLLM SGLang vLLM-Omni --- --- --- --- 核心执行对象 通用模型请求与 token budget 请求、前缀树与缓存感知调度 多模态异构 stage 代表性缓存设计 Paged KV、prefix caching RadixAttention、分层缓存 按阶段传递状态与媒体表示 扩展重点 模型覆盖、kernel、分布式和服务接口 高复用 workload、MoE、P/D 与可观测性 AR、DiT、codec 等跨阶段流水 主要复杂度 广泛组合的兼容与性能 缓存、调度、公平性耦合 不同执行循环和资源的协调 这张表是架构阅读框架，不替代具体版本兼容矩阵。 不应怎样选 只数 feature 同名特性可能处于不同完成度：文档概念、原型、真实后端和有 workload 的性能验证不是同一层。 用单个 tokens/s 决定 模型、输入输出长度、并发、硬件、量化格式和延迟 SLO 改变后，排序可能变化。必须使用自己的请求分布。 把 Omni 当作“多一个图片输入” 生成图像、音频或视频可能包含自回归 Transformer、codec 和 diffusion 等不同循环。它们需要阶段级并行、资源分配和流式输出，而不是在文本引擎上加一个字段。 mini-infer 应该学什么 mini-infer 不应追求复制所有生产 feature。更有教学价值的是建立四级证据：概念解释、最小原型、真实 backend、性能验证。Paged KV、连续批处理、chunked prefill 和前缀缓存进入主线；大规模 MoE/EP 和完整 Omni pipeline 保持边界说明或独立课程。 选型清单 1. 明确模型与任务：文本、VLM、embedding 还是生成媒体。 2. 固定请求到达和长度分布。 3. 明确 TTFT、TPOT、吞吐和尾延迟目标。 4. 核对硬件、量化与 kernel 组合。 5. 验证观测、故障恢复和发布能力。 框架迭代很快，本篇只对核验日期负责，部署前必须重新检查 stable 文档与 release notes。 参考资料 - vLLM 官方文档 https://docs.vllm.ai/en/stable/ - SGLang 官方文档 https://docs.sglang.ai/ - vLLM-Omni 官方仓库 https://github.com/vllm-project/vllm-omni 资料核验日期：2026-08-02。 "}, {"title": "第一个自定义 CUDA 算子应该验证什么", "summary": "以向量加法为最小例子，建立从 grid-stride loop、PyTorch 扩展到正确性和性能验收的算子学习闭环。", "category": "CUDA 与算子", "tags": ["CUDA", "PyTorch Extension", "Kernel Validation"], "series": "CUDA 与算子工程", "date": "2026-07-31", "href": "posts/first-custom-cuda-operator.html", "text": " 问题背景 第一个 CUDA kernel 很容易停在“能编译、能输出”。但自定义算子的目标不是换一种语法实现加法，而是建立接口、并行映射、正确性和性能证据的完整链路。 一句话结论 一个合格的最小算子至少要回答：线程负责哪些元素、任意 shape 是否正确、dtype/device/contiguous 如何约束、错误如何暴露，以及它在什么规模下比框架基线有意义。 最小 kernel cpp global void add kernel const float x, const float y, float out, int64 t n { for int64 t i = blockIdx.x blockDim.x + threadIdx.x; i < n; i += blockDim.x gridDim.x { out i = x i + y i ; } } Grid-stride loop 让同一个 kernel 覆盖任意长度，并允许网格大小与数据长度解耦。包装层还需检查张量位于 CUDA、dtype 一致、元素数量一致，并使用当前 CUDA stream，而不是偷偷同步默认流。 正确性不是只测一个 shape 推荐测试集合： - n=0、1、31、32、33 等边界； - 非 block size 整数倍； - 大张量； - 不同 dtype（如果声明支持）； - 非连续张量：明确拒绝或正确处理； - 多 stream 场景； - 与 torch.add 的容差对拍。 性能验证 向量加法通常受显存带宽限制。计时必须预热、使用 CUDA event、同步正确边界，并报告数据规模。小张量可能被 Python 和 launch overhead 主导，自定义 kernel 比 PyTorch 慢并不意外。 python start.record for in range iters : out = custom add x, y end.record torch.cuda.synchronize ms = start.elapsed time end / iters 还应对比有效带宽，而不只是毫秒：每个元素读取 x/y 并写出 out ，FP32 理论数据量约为 12 n 字节。该估算忽略缓存和其他开销，但能帮助识别数量级错误。 本机环境边界 MyStudy 当前 PyTorch CUDA runtime 能运行 GPU 张量和 FlashInfer，但自定义 CUDA 扩展还依赖本机 CUDA Toolkit、编译器与 PyTorch ABI 匹配。缺少 nvcc 时可以学习源码、接口和模拟验证，不能把它描述为本机 kernel 实测。 参考资料 - CUDA C++ Programming Guide https://docs.nvidia.com/cuda/cuda-c-programming-guide/ - PyTorch C++/CUDA Extensions https://pytorch.org/tutorials/advanced/cpp extension.html 资料核验日期：2026-08-03。 "}, {"title": "Prefill 与 Decode 为什么会争抢同一块 GPU", "summary": "从计算密度和 KV 读取差异出发，理解 chunked prefill、token budget 与 P/D 分离分别解决什么问题。", "category": "推理系统", "tags": ["Prefill", "Decode", "Chunked Prefill"], "series": "推理框架核心技术", "date": "2026-07-30", "href": "posts/prefill-decode-scheduling.html", "text": " 一句话结论 Prefill 偏计算密集，Decode 偏 KV Cache 读取和小批次调度；把它们直接混在一个无限制队列里，会让长提示词和在线生成互相干扰。 两类工作负载 Prefill 对整段 prompt 建立 KV Cache，输入 token 多，矩阵乘法形状较大。Decode 每轮为每个序列增加少量 token，但反复读取历史 KV。两者对算力、带宽和延迟的需求不同。 text 长 Prompt 进入 ├─ 一次完成 Prefill：TTFT 可能较好，但正在 Decode 的请求出现抖动 └─ 切成多个 Chunk：Decode 更平滑，但新请求首 token 可能推迟 Chunked Prefill 的作用 Chunked Prefill 把长 prompt 分成多个 token chunk，让调度器在 chunk 之间插入 Decode。它不是免费的：chunk 太小会增加调度和 kernel 启动开销，太大又无法缓解阻塞。 因此需要统一 token budget，例如每轮允许 2048 个 token，由 Decode token 和 Prefill chunk 共同消费。策略必须明确是否优先保护正在流式输出的请求。 P/D 分离不是同一个层次 Chunked Prefill 在同一执行资源上进行时间切片；Prefill/Decode disaggregation 则把两个阶段放到不同 worker 或资源池，再传输 KV Cache。后者能独立扩缩容和隔离干扰，但增加 KV 传输、路由、故障恢复和可观测性成本。 只有当计算隔离收益大于传输与运维成本时，P/D 分离才值得。教学框架可先实现双引擎原型和 KV connector 契约，不应把进程间模拟宣称为生产级分离。 应该记录什么 - prompt 长度和输出长度分布； - TTFT、TPOT、吞吐及 P95/P99； - 每轮 Prefill/Decode token 数； - KV 传输字节和等待时间； - chunk 大小变化带来的反例。 本篇是原理与调度契约说明，没有给出特定 GPU 的实测结论。 参考资料 - vLLM Chunked Prefill 文档 https://docs.vllm.ai/ - SGLang P/D Disaggregation https://docs.sglang.ai/backend/pd disaggregation.html 资料核验日期：2026-07-30。 "}, {"title": "Continuous Batching 为什么比静态批处理更适合在线生成", "summary": "用请求完成时间不同这一事实，解释连续批处理如何在每个解码步重新组织批次，并讨论吞吐与延迟边界。", "category": "推理系统", "tags": ["Continuous Batching", "Scheduling", "Throughput"], "series": "推理框架核心技术", "date": "2026-07-29", "href": "posts/continuous-batching.html", "text": " 问题背景 静态批处理要求一批请求一起开始、一起结束。文本生成长度不一致，短请求完成后仍要等待最长请求，空出的计算位置无法及时交给新请求。在线服务还会持续收到请求，更不适合固定批次边界。 一句话结论 Continuous Batching 在每轮迭代后移除已完成请求并接纳新请求，让批次成为动态状态，而不是一次性张量。 调度循环 python while waiting or running: running = req for req in running if not req.finished while waiting and token budget.can admit waiting 0 : running.append waiting.pop 0 outputs = decode step running update requests running, outputs 这段代码是控制流模拟。生产实现还需管理 Prefill token、KV block、取消、优先级和分布式 worker 一致性。 为什么吞吐会上升 假设一批四个请求分别生成 2、4、8、16 个 token。静态批处理在 16 轮内都占用四个槽位，其中大量位置只是 padding。连续批处理能在第 2、4、8 轮释放槽位并接入新请求，使有效 token 比例提高。 但“始终塞满 GPU”不是唯一目标。调度器还必须限制： - 单轮总 token 数； - Prefill 与 Decode 的资源比例； - 最大并发序列和 KV Cache 使用； - 高优先级请求的等待时间； - 长请求对短请求的影响。 三种容易混淆的指标 - 吞吐：单位时间完成多少 token 或请求。 - TTFT：请求进入到首 token 返回的时间。 - TPOT：生成阶段相邻 token 的平均时间。 提高并发通常能提升吞吐，但排队和批次变大可能恶化 TTFT、TPOT 或尾延迟。因此 benchmark 必须给出请求到达模型和输出长度分布，不能只报告离线 tokens/s。 常见失败 已完成请求没有立即释放 KV 调度列表看似移除了请求，但缓存仍被引用，运行一段时间后出现伪 OOM。 随机数状态随批次位置变化 请求进入和离开导致批次重排，若采样 RNG 绑定 batch index，同一请求在不同并发下可能得到不同输出。每请求 seed 应绑定请求身份。 取消只断开网络连接 如果调度器和 KV 管理器没有收到取消事件，GPU 仍会为无人接收的请求生成 token。 最小验收 构造固定到达时间和输出长度的请求流，对比静态与连续批处理的有效槽位比例；随后检查每个请求输出、seed 稳定性和最终空闲块数量。该模拟能验证调度状态机，但不能替代 GPU 性能结论。 参考资料 - vLLM 官方文档 https://docs.vllm.ai/ - Orca: A Distributed Serving System for Transformer-Based Generative Models https://www.usenix.org/conference/osdi22/presentation/yu 资料核验日期：2026-07-29。 "}, {"title": "Paged KV Cache 解决的不是注意力计算，而是显存管理", "summary": "从连续预留的碎片问题出发，解释 block table、物理块分配、引用计数和分页注意力之间的契约。", "category": "推理系统", "tags": ["PagedAttention", "KV Cache", "Memory Management"], "series": "推理框架核心技术", "date": "2026-07-28", "href": "posts/paged-kv-cache.html", "text": " 问题背景 自回归生成需要保存每层注意力的 Key 和 Value。最直观的实现是为每个请求预留 max seq len 对应的连续空间，但真实请求长度差异很大：短请求浪费尾部空间，长请求又可能因为找不到足够大的连续区域而失败。 一句话结论 Paged KV Cache 把“序列逻辑位置”和“显存物理位置”分开：序列看到连续 token，内核通过 block table 找到离散物理块。它首先是一种内存管理设计，PagedAttention 是消费这种布局的执行内核。 三个核心对象 text Sequence: token 0 1 2 3 4 5 6 Logical: block 0 block 1 Block table: physical 7, physical 2 Allocator: free= 0,1,3,4,5,6,... - 逻辑块：请求内部的连续编号。 - 物理块：真实 KV Cache 存储单元。 - block table：逻辑块到物理块的映射。 注意力 kernel 不能只收到一个连续 KV 指针，还必须收到 block table、每个序列的有效长度和块大小。这就是调度器、缓存管理器和 kernel 之间的元数据契约。 最小分配模拟 下面代码是 CPU 状态机模拟，不是 GPU PagedAttention 实测： python class BlockPool: def init self, count : self.free = list range count self.refs = 0 count def alloc self : if not self.free: raise RuntimeError \"KV blocks exhausted\" block = self.free.pop self.refs block = 1 return block def release self, block : self.refs block -= 1 if self.refs block == 0: self.free.append block 真实实现还需要处理共享前缀、copy-on-write、异常回滚和并发安全。引用计数错误通常不会立刻报错，而会表现为缓存泄漏或不同请求互相污染。 块大小不是越小越好 小块减少尾部碎片，但 block table 更长、元数据访问更多；大块降低映射开销，却增加请求最后一块的浪费。合理块大小取决于序列长度分布、kernel 支持和硬件访存特征，不能只看单请求峰值显存。 验收方法 1. 随机生成不同长度请求，核对已用块与理论值。 2. 完成和取消请求后，空闲块数量必须恢复。 3. 共享前缀释放一个请求时，公共块不能提前回收。 4. 物理块顺序打乱后，输出仍应与连续 KV 参考实现一致。 本篇提供原理和模拟验证；真实收益必须在固定模型、块大小、并发分布和 GPU 上报告。 参考资料 - PagedAttention 论文 https://arxiv.org/abs/2309.06180 - vLLM 官方文档 https://docs.vllm.ai/ 资料核验日期：2026-07-28。 "}, {"title": "一次 LLM 推理请求到底经历了什么", "summary": "从请求进入服务到 token 流式返回，建立连接调度、KV Cache、Prefill、Decode 和采样的完整系统视图。", "category": "推理系统", "tags": ["LLM Inference", "Scheduling", "KV Cache"], "series": "推理框架核心技术", "date": "2026-07-27", "href": "posts/llm-inference-request-lifecycle.html", "text": " 问题背景 调用一个大模型服务时，我们通常只看到输入文本和逐步出现的输出 token。但在服务内部，请求需要经过分词、准入、批处理、KV Cache 分配、Prefill、Decode、采样和流式返回。任何一个阶段处理不当，都可能表现为首 token 慢、吞吐下降、显存浪费或尾延迟抖动。 如果只把推理理解成一次 model.forward ，就很难解释现代框架为什么需要调度器、分页 KV Cache、连续批处理和前缀缓存。 一句话结论 现代 LLM 推理引擎不是单纯的模型执行器，而是一套围绕“请求状态、显存块和每轮 token 预算”不断做资源决策的在线系统。 完整请求链路 一次典型请求可以抽象为： text HTTP / API 请求 → 参数校验与分词 → 准入队列 → 调度器选择本轮序列 → KV Cache 分配 → Prefill 计算提示词 → Decode 每轮生成一个或多个 token → 采样与停止条件 → 流式返回并释放资源 这条链路中有三类状态同时变化： - 请求状态：等待、运行、抢占、完成或失败。 - 模型状态：本轮输入 token、位置编码和注意力元数据。 - 系统状态：可用显存块、批次 token 数、队列长度和流式连接。 Prefill 和 Decode 为什么必须区分 Prefill 一次处理提示词中的大量 token，通常能形成较大的矩阵乘法，计算密度较高。Decode 通常每个序列每轮只增加一个 token，却需要持续读取历史 KV Cache，更容易受到显存带宽和调度开销影响。 因此，两个阶段对资源的偏好不同： 阶段 输入形态 主要压力 用户感知指标 --- --- --- --- Prefill 一个请求的多个 token 计算量、临时激活、准入预算 TTFT，首 token 延迟 Decode 多个请求各自的新 token KV Cache 读取、调度、同步 TPOT，逐 token 延迟 如果无限制地接收长提示词，Prefill 会占据计算资源，让正在 Decode 的请求长时间等不到下一轮；如果只照顾 Decode，新请求又会一直得不到首 token。Chunked Prefill、优先级和 token budget 本质上都在处理这个矛盾。 调度器每轮真正决定什么 一个最小调度器不只是“从队列里拿前 N 个请求”。它至少要回答： 1. 本轮允许处理多少 token？ 2. 哪些请求继续 Decode？ 3. 哪些新请求可以进入 Prefill？ 4. KV Cache 是否还有足够块？ 5. 资源不足时等待、抢占还是重计算？ 下面的伪代码只表达控制关系，不代表某个框架的真实实现： python while engine.is running: budget = scheduler.new token budget batch = scheduler.select running, waiting, budget cache manager.reserve batch model output = model runner.execute batch tokens = sampler.sample model output scheduler.update batch, tokens streamer.publish tokens cache manager.release finished batch select 、 reserve 和 update 共同构成了推理引擎的核心控制面。模型 forward 属于数据面，但数据面能否高效运行取决于控制面提供的批次与内存布局。 KV Cache 为什么成为系统核心 自回归生成会反复使用历史 token 的 Key 和 Value。保存它们可以避免每一轮从头计算，但缓存大小会随序列长度和并发数增长。若每个请求预留一整块连续最大长度空间，会产生严重的内部碎片；若缓存块不能灵活回收，又会降低并发能力。 分页 KV Cache 把逻辑连续的序列映射到一组物理块，使系统能按需分配和回收。它带来的不只是“省显存”，还改变了调度器能够安全接纳多少请求，以及前缀共享、抢占和多分支生成的实现方式。 常见误区与失败模式 吞吐高不等于体验好 增大批次通常能提高总 token 吞吐，但可能恶化 TTFT 或 TPOT。服务评测至少要同时报告吞吐、首 token 延迟、逐 token 延迟和尾延迟。 GPU 利用率高不等于系统健康 GPU 长时间忙碌可能是有效计算，也可能是长 Prefill 阻塞、无效 padding 或不合理重计算。必须结合请求队列和缓存状态解释利用率。 能生成正确文本不等于调度正确 并发场景还需要验证取消请求、超时、资源释放、停止条件和流式顺序。单请求输出对拍无法覆盖这些系统问题。 如何验证一个最小推理框架 可以按四层证据逐步验收： 1. 正确性：单请求输出与参考实现对齐。 2. 状态机：并发、取消、完成和资源释放不破坏状态。 3. 资源：KV block 的分配、引用和回收可追踪，无泄漏。 4. 服务指标：固定请求集合下记录 TTFT、TPOT、吞吐和峰值显存。 本篇是原理与源码阅读导图，没有给出特定 GPU 的实测 benchmark。后续文章会分别拆解 PagedAttention、Continuous Batching 和 Chunked Prefill，并映射到 mini-infer 的具体模块。 延伸学习 MyStudy 的 mini-infer 课程会从最小执行循环开始，逐步加入调度、Paged KV、前缀缓存、投机解码、结构化输出和多模态能力。阅读本文后，建议先找到请求对象、调度器、KV Cache 管理器和模型执行器四个边界，再进入具体优化。 参考资料 - vLLM 官方文档 https://docs.vllm.ai/ - SGLang 官方文档 https://docs.sglang.ai/ - PagedAttention 论文 https://arxiv.org/abs/2309.06180 资料核验日期：2026-07-27。 "}]</script>
<script>
(() => {
  const input = document.getElementById('blogSearchInput');
  const status = document.getElementById('blogSearchStatus');
  const results = document.getElementById('blogSearchResults');
  const posts = JSON.parse(document.getElementById('blogSearchData').textContent);
  const escapeHtml = value => value.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[ch]);
  const render = () => {
    const query = input.value.trim().toLocaleLowerCase();
    if (!query) { results.replaceChildren(); status.textContent = `输入关键词开始搜索，共 ${posts.length} 篇文章。`; return; }
    const matched = posts.filter(post => [post.title, post.summary, post.category, post.series, post.tags.join(' '), post.text].join(' ').toLocaleLowerCase().includes(query));
    status.textContent = matched.length ? `找到 ${matched.length} 篇相关文章。` : `没有找到与“${input.value.trim()}”相关的文章。`;
    results.innerHTML = matched.map(post => `<a class="blog-search-result" data-target="${escapeHtml(post.href)}"><div><span>${escapeHtml(post.category)}</span><time>${escapeHtml(post.date)}</time></div><h2>${escapeHtml(post.title)}</h2><p>${escapeHtml(post.summary)}</p><small>${post.tags.map(escapeHtml).join(' · ')}</small></a>`).join('');
    results.querySelectorAll('[data-target]').forEach(link => { link.href = link.dataset.target; });
  };
  input.addEventListener('input', render);
})();
</script></main>
