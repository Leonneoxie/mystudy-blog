<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="760" viewBox="0 0 1260 760">

<defs>
  <style>
    .title{font:700 28px Arial, "Microsoft YaHei", sans-serif; fill:#172033}
    .sub{font:600 16px Arial, "Microsoft YaHei", sans-serif; fill:#34415c}
    .txt{font:14px Arial, "Microsoft YaHei", sans-serif; fill:#243047}
    .small{font:12px Arial, "Microsoft YaHei", sans-serif; fill:#4b5875}
    .box{rx:8; ry:8; fill:#ffffff; stroke:#9fb2d6; stroke-width:1.4}
    .box2{rx:8; ry:8; fill:#f7fbff; stroke:#9bd1c6; stroke-width:1.4}
    .warn{rx:8; ry:8; fill:#fff8ed; stroke:#f0b66d; stroke-width:1.4}
    .line{stroke:#6b7a99; stroke-width:2; fill:none; marker-end:url(#arrow)}
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7a99"/>
  </marker>
</defs>

<rect width="1260" height="760" fill="#f8fafc"/>
<text class="title" x="48" y="58">推理服务优化地图</text>
<text class="txt" x="48" y="88">不同优化针对不同瓶颈：算力、显存、KV、调度、长上下文、网络延迟。</text>
<rect class="box" x="80" y="150" width="230" height="150"/><text class="sub" x="112" y="186">模型/权重</text><text class="txt" x="112" y="224">量化/剪枝/蒸馏</text><text class="txt" x="112" y="254">LoRA merge</text><text class="txt" x="112" y="284">weight packing</text>
<rect class="box2" x="380" y="150" width="230" height="150"/><text class="sub" x="412" y="186">KV/上下文</text><text class="txt" x="412" y="224">PagedAttention</text><text class="txt" x="412" y="254">KV quant</text><text class="txt" x="412" y="284">prefix cache</text>
<rect class="box2" x="680" y="150" width="230" height="150"/><text class="sub" x="712" y="186">调度/系统</text><text class="txt" x="712" y="224">continuous batching</text><text class="txt" x="712" y="254">chunked prefill</text><text class="txt" x="712" y="284">disaggregated</text>
<rect class="warn" x="980" y="150" width="200" height="150"/><text class="sub" x="1012" y="186">生成算法</text><text class="txt" x="1012" y="224">speculative</text><text class="txt" x="1012" y="254">Medusa/EAGLE</text><text class="txt" x="1012" y="284">sampling</text>
<rect class="box" x="200" y="450" width="860" height="118"/><text class="sub" x="234" y="488">选择原则</text><text class="txt" x="234" y="526">先按 workload 判断：长 prompt 优先 TTFT/KV，长输出优先 TPOT，重复 prompt 优先 cache，高并发优先 scheduler。</text>
</svg>
