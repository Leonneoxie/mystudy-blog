<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="520" viewBox="0 0 1060 520">

<style>
  .title { font: 700 22px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
  .subtitle { font: 500 14px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #44546a; }
  .label { font: 650 15px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
  .small { font: 500 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #44546a; }
  .box { fill: #f8fafc; stroke: #8aa0b8; stroke-width: 1.3; rx: 8; }
  .blue { fill: #e8f3ff; stroke: #4d8fd8; }
  .green { fill: #e9f7ef; stroke: #42a36f; }
  .yellow { fill: #fff4d8; stroke: #d39b22; }
  .red { fill: #ffecec; stroke: #d46a6a; }
  .purple { fill: #f1edff; stroke: #7f6fd1; }
  .teal { fill: #e5fbf8; stroke: #2c9f93; }
  .arrow { stroke: #53657d; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
  .dash { stroke: #8795a8; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow); }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L8,3 z" fill="#53657d" />
  </marker>
</defs>

      <rect width="1060" height="520" fill="#ffffff"/>
      <text x="34" y="42" class="title">LLM 量化算法族谱：先分对象，再分方法</text>
      <text x="34" y="70" class="subtitle">量化不是一个算法，而是一组围绕 weights / activations / KV cache / runtime 的压缩和校正方法。</text>

      <rect x="70" y="120" width="200" height="86" class="box blue"/>
      <text x="112" y="154" class="label">Weight-only</text>
      <text x="95" y="180" class="small">RTN / GPTQ / AWQ</text>
      <text x="95" y="198" class="small">W8A16 / W4A16</text>

      <rect x="310" y="120" width="200" height="86" class="box green"/>
      <text x="358" y="154" class="label">W + A</text>
      <text x="337" y="180" class="small">SmoothQuant / OmniQuant</text>
      <text x="337" y="198" class="small">W8A8 / FP8</text>

      <rect x="550" y="120" width="200" height="86" class="box yellow"/>
      <text x="598" y="154" class="label">KV Cache</text>
      <text x="575" y="180" class="small">KIVI / KVQuant</text>
      <text x="575" y="198" class="small">QJL / PolarQuant / TurboQuant</text>

      <rect x="790" y="120" width="200" height="86" class="box purple"/>
      <text x="832" y="154" class="label">Rotation</text>
      <text x="815" y="180" class="small">QuaRot / SpinQuant</text>
      <text x="815" y="198" class="small">Hadamard / learned R</text>

      <rect x="145" y="290" width="210" height="86" class="box red"/>
      <text x="198" y="324" class="label">PTQ</text>
      <text x="176" y="350" class="small">训练后校准/压缩</text>

      <rect x="425" y="290" width="210" height="86" class="box teal"/>
      <text x="476" y="324" class="label">QAT / PTQ+</text>
      <text x="455" y="350" class="small">少量训练/rounding 学习</text>

      <rect x="705" y="290" width="210" height="86" class="box"/>
      <text x="754" y="324" class="label">Runtime</text>
      <text x="732" y="350" class="small">packing / dequant / fused kernel</text>

      <path d="M170 206 C180 245 210 263 250 290" class="dash"/>
      <path d="M410 206 C420 245 470 263 530 290" class="dash"/>
      <path d="M650 206 C665 245 730 263 810 290" class="dash"/>
      <path d="M890 206 C890 245 860 263 810 290" class="dash"/>

      <text x="80" y="448" class="small">关键判断：质量取决于误差建模，性能取决于低精度 kernel 与 serving 场景是否真正命中瓶颈。</text>
    </svg>
