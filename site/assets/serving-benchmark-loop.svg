<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620">
<rect width="1180" height="620" fill="#f8fafc"/>
<style>
.title{font-family:Inter,Microsoft YaHei,Arial;font-size:30px;font-weight:800;fill:#0f172a}
.sub{font-family:Inter,Microsoft YaHei,Arial;font-size:18px;font-weight:800;fill:#0f172a}
.txt{font-family:Inter,Microsoft YaHei,Arial;font-size:15px;fill:#334155}
.small{font-family:Inter,Microsoft YaHei,Arial;font-size:13px;fill:#64748b}
.box{fill:#ffffff;stroke:#cbd5e1;stroke-width:2;rx:12}
.blue{fill:#e0f2fe;stroke:#38bdf8;stroke-width:2;rx:12}
.green{fill:#dcfce7;stroke:#22c55e;stroke-width:2;rx:12}
.orange{fill:#ffedd5;stroke:#fb923c;stroke-width:2;rx:12}
.purple{fill:#ede9fe;stroke:#8b5cf6;stroke-width:2;rx:12}
.arrow{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<text x="48" y="58" class="title">真实框架量化 Serving Benchmark 闭环</text>
<text x="48" y="92" class="txt">从同一组 prompt 出发，对比 Transformers / vLLM / SGLang / TensorRT-LLM / llama.cpp，分开看质量、显存、TTFT、TPOT、吞吐和回滚。</text>
<rect class="blue" x="70" y="150" width="190" height="120"/><text class="sub" x="108" y="190">实验清单</text><text class="txt" x="108" y="226">prompts</text><text class="txt" x="108" y="252">quality gates</text>
<rect class="green" x="330" y="150" width="190" height="120"/><text class="sub" x="364" y="190">模型配置</text><text class="txt" x="364" y="226">fp16 / W8 / W4</text><text class="txt" x="364" y="252">KV dtype</text>
<rect class="orange" x="590" y="150" width="190" height="120"/><text class="sub" x="626" y="190">Runtime</text><text class="txt" x="626" y="226">vLLM / SGLang</text><text class="txt" x="626" y="252">kernel logs</text>
<rect class="purple" x="850" y="150" width="210" height="120"/><text class="sub" x="890" y="190">Benchmark</text><text class="txt" x="890" y="226">TTFT / TPOT</text><text class="txt" x="890" y="252">memory / quality</text>
<path class="arrow" d="M260 210 H330"/><path class="arrow" d="M520 210 H590"/><path class="arrow" d="M780 210 H850"/>
<rect class="box" x="110" y="360" width="960" height="150"/><text class="sub" x="150" y="405">发布验收</text><text class="txt" x="150" y="442">1. 同 tokenizer / chat template / sampling 参数；2. 固定 prompt set；3. prefill 与 decode 分开统计；4. 检查 quant kernel fallback；5. 保存 manifest 和 rollback plan。</text><text class="small" x="150" y="482">核心判断：模型能加载只是第一步，真正要证明的是质量可接受、延迟下降、显存下降、长上下文稳定、线上可回滚。</text></rect>
</svg>
