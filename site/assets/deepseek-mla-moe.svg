<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="540" viewBox="0 0 1180 540">
  <rect width="1180" height="540" fill="#fffafa"/>
  <text x="48" y="58" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#172033">DeepSeek 系：MLA + MoE + 训练系统协同</text>
  <g font-family="Arial, sans-serif" font-size="16">
    <rect x="64" y="112" width="220" height="120" rx="12" fill="#fff0ed" stroke="#e88f80" stroke-width="2"/>
    <text x="96" y="150" font-size="21" font-weight="700">MLA</text>
    <text x="96" y="180">把 K/V 压到 latent</text>
    <text x="96" y="206">降低长上下文 KV cache</text>
    <line x1="284" y1="172" x2="382" y2="172" stroke="#9b3a2d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="382" y="112" width="230" height="120" rx="12" fill="#fff0ed" stroke="#e88f80" stroke-width="2"/>
    <text x="414" y="150" font-size="21" font-weight="700">DeepSeekMoE</text>
    <text x="414" y="180">总参数很大</text>
    <text x="414" y="206">每 token 只激活部分专家</text>
    <line x1="612" y1="172" x2="710" y2="172" stroke="#9b3a2d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="710" y="112" width="230" height="120" rx="12" fill="#fff0ed" stroke="#e88f80" stroke-width="2"/>
    <text x="742" y="150" font-size="21" font-weight="700">FP8 + DualPipe</text>
    <text x="742" y="180">降低训练成本</text>
    <text x="742" y="206">减少流水线空泡</text>

    <rect x="86" y="306" width="300" height="120" rx="12" fill="#ffffff" stroke="#e5b0a8"/>
    <text x="116" y="342" font-size="20" font-weight="700">推理视角</text>
    <text x="116" y="374">KV cache 更小，长上下文更友好</text>
    <text x="116" y="400">但需要更复杂的 attention kernel</text>

    <rect x="440" y="306" width="300" height="120" rx="12" fill="#ffffff" stroke="#e5b0a8"/>
    <text x="470" y="342" font-size="20" font-weight="700">训练视角</text>
    <text x="470" y="374">MoE 扩大容量，不线性增加 FLOPs</text>
    <text x="470" y="400">路由、负载均衡、通信成为新瓶颈</text>

    <rect x="794" y="306" width="300" height="120" rx="12" fill="#ffffff" stroke="#e5b0a8"/>
    <text x="824" y="342" font-size="20" font-weight="700">模型能力视角</text>
    <text x="824" y="374">R1 展示 RL 可直接塑造 reasoning</text>
    <text x="824" y="400">小模型可通过蒸馏继承推理轨迹</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9b3a2d"/>
    </marker>
  </defs>
</svg>
