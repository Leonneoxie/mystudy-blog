<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="740" viewBox="0 0 1260 740">

<defs>
  <style>
    .title{font:700 28px Arial, "Microsoft YaHei", sans-serif; fill:#172033}
    .sub{font:600 16px Arial, "Microsoft YaHei", sans-serif; fill:#34415c}
    .txt{font:14px Arial, "Microsoft YaHei", sans-serif; fill:#243047}
    .small{font:12px Arial, "Microsoft YaHei", sans-serif; fill:#4b5875}
    .box{rx:8; ry:8; fill:#ffffff; stroke:#9fb2d6; stroke-width:1.4}
    .box2{rx:8; ry:8; fill:#f7fbff; stroke:#9bd1c6; stroke-width:1.4}
    .warn{rx:8; ry:8; fill:#fff8ed; stroke:#f0b66d; stroke-width:1.4}
    .line{stroke:#6b7a99; stroke-width:2; fill:none; marker-end:url(#arrow)}
  </style>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7a99"/>
  </marker>
</defs>

<rect width="1260" height="740" fill="#f7f9fc"/>
<text class="title" x="48" y="58">算子 Benchmark / Profile 闭环</text>
<text class="txt" x="48" y="88">算子开发的交付标准是可复现的正确性和性能，而不是只跑通一次。</text>
<rect class="box" x="70" y="150" width="210" height="140"/>
<text class="sub" x="96" y="188">Baseline</text>
<text class="txt" x="96" y="226">PyTorch/官方 op</text>
<text class="txt" x="96" y="252">固定 shape</text>
<text class="txt" x="96" y="278">固定 dtype</text>
<rect class="box2" x="320" y="150" width="210" height="140"/>
<text class="sub" x="346" y="188">Correctness</text>
<text class="txt" x="346" y="226">max error</text>
<text class="txt" x="346" y="252">relative error</text>
<text class="txt" x="346" y="278">边界 shape</text>
<path class="line" d="M280 220 H320"/>
<rect class="box2" x="570" y="150" width="210" height="140"/>
<text class="sub" x="596" y="188">Benchmark</text>
<text class="txt" x="596" y="226">warmup</text>
<text class="txt" x="596" y="252">repeat</text>
<text class="txt" x="596" y="278">p50/p95</text>
<path class="line" d="M530 220 H570"/>
<rect class="warn" x="820" y="150" width="210" height="140"/>
<text class="sub" x="846" y="188">Profile</text>
<text class="txt" x="846" y="226">memory/compute</text>
<text class="txt" x="846" y="252">occupancy</text>
<text class="txt" x="846" y="278">trace</text>
<path class="line" d="M780 220 H820"/>
<rect class="warn" x="1070" y="150" width="210" height="140"/>
<text class="sub" x="1096" y="188">Report</text>
<text class="txt" x="1096" y="226">瓶颈</text>
<text class="txt" x="1096" y="252">收益</text>
<text class="txt" x="1096" y="278">限制</text>
<path class="line" d="M1030 220 H1070"/>
<rect class="box" x="150" y="430" width="960" height="126"/>
<text class="sub" x="184" y="468">学习判断</text>
<text class="txt" x="184" y="506">每个 kernel 都要有 baseline、误差、延迟、带宽/算力、profile 证据和适用边界。</text>
</svg>
