<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520">
  <rect width="1180" height="520" fill="#fbfcff"/>
  <text x="48" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">LLM 演进主线：从 dense scaling 到高效推理与可控 reasoning</text>
  <line x1="82" y1="180" x2="1098" y2="180" stroke="#25364d" stroke-width="4"/>
  <g font-family="Arial, sans-serif">
    <circle cx="110" cy="180" r="12" fill="#4b7bec"/>
    <text x="78" y="145" font-size="19" font-weight="700" fill="#1d2b44">2017</text>
    <rect x="42" y="208" width="150" height="92" rx="10" fill="#e8f0ff" stroke="#9bb6ff"/>
    <text x="64" y="238" font-size="17" font-weight="700">Transformer</text>
    <text x="62" y="266" font-size="14">Self-Attention</text>
    <text x="62" y="288" font-size="14">可并行训练</text>

    <circle cx="290" cy="180" r="12" fill="#00a389"/>
    <text x="260" y="145" font-size="19" font-weight="700" fill="#1d2b44">2020</text>
    <rect x="220" y="208" width="160" height="92" rx="10" fill="#e8fff8" stroke="#7bdacb"/>
    <text x="252" y="238" font-size="17" font-weight="700">GPT-3</text>
    <text x="242" y="266" font-size="14">175B dense</text>
    <text x="242" y="288" font-size="14">few-shot / scaling</text>

    <circle cx="480" cy="180" r="12" fill="#f6b93b"/>
    <text x="450" y="145" font-size="19" font-weight="700" fill="#1d2b44">2023</text>
    <rect x="405" y="208" width="178" height="110" rx="10" fill="#fff6dd" stroke="#f3ca7b"/>
    <text x="450" y="238" font-size="17" font-weight="700">LLaMA</text>
    <text x="427" y="266" font-size="14">RMSNorm / RoPE</text>
    <text x="427" y="288" font-size="14">SwiGLU / 开放生态</text>
    <text x="427" y="310" font-size="14">Llama2: Chat+GQA</text>

    <circle cx="685" cy="180" r="12" fill="#9b59b6"/>
    <text x="655" y="145" font-size="19" font-weight="700" fill="#1d2b44">2024</text>
    <rect x="600" y="208" width="194" height="122" rx="10" fill="#f7ebff" stroke="#caa2e8"/>
    <text x="650" y="238" font-size="17" font-weight="700">Llama 3</text>
    <text x="625" y="266" font-size="14">15T+ tokens</text>
    <text x="625" y="288" font-size="14">128K vocab / GQA</text>
    <text x="625" y="310" font-size="14">3.1: 405B / 128K ctx</text>

    <circle cx="900" cy="180" r="12" fill="#e55039"/>
    <text x="870" y="145" font-size="19" font-weight="700" fill="#1d2b44">2024-25</text>
    <rect x="810" y="208" width="200" height="142" rx="10" fill="#fff0ed" stroke="#f2a294"/>
    <text x="860" y="238" font-size="17" font-weight="700">DeepSeek</text>
    <text x="832" y="266" font-size="14">V2: MLA + MoE</text>
    <text x="832" y="288" font-size="14">V3: 671B / 37B active</text>
    <text x="832" y="310" font-size="14">FP8 / DualPipe / MTP</text>
    <text x="832" y="332" font-size="14">R1: RL reasoning</text>

    <circle cx="1080" cy="180" r="12" fill="#2d98da"/>
    <text x="1045" y="145" font-size="19" font-weight="700" fill="#1d2b44">2025</text>
    <rect x="1016" y="208" width="134" height="122" rx="10" fill="#eaf6ff" stroke="#8ccaf2"/>
    <text x="1040" y="238" font-size="17" font-weight="700">Qwen3</text>
    <text x="1032" y="266" font-size="14">Dense + MoE</text>
    <text x="1032" y="288" font-size="14">thinking mode</text>
    <text x="1032" y="310" font-size="14">agent / multilingual</text>
  </g>
  <rect x="90" y="386" width="1000" height="70" rx="12" fill="#ffffff" stroke="#d4dce8"/>
  <text x="118" y="428" font-family="Arial, sans-serif" font-size="19" fill="#24344f">核心转变：参数越大不再是唯一叙事；训练数据、KV cache、MoE 激活成本、后训练 reasoning、部署生态一起决定模型价值。</text>
</svg>
