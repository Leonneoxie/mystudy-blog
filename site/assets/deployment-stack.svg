<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520">
  <defs>
    <style>
      .bg{fill:#f8fafc}.box{fill:#fff;stroke:#334155;stroke-width:2;rx:8}.blue{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:8}.green{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:8}.orange{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:8}.purple{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2;rx:8}.red{fill:#fef2f2;stroke:#dc2626;stroke-width:2;rx:8}
      .text{font:16px Arial,sans-serif;fill:#0f172a}.muted{font:13px Arial,sans-serif;fill:#475569}.title{font:24px Arial,sans-serif;fill:#0f172a}.arrow{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  </defs>
  <rect class="bg" width="1080" height="520"/>
  <text class="title" x="36" y="42">LLM Deployment Stack: 量化只是部署链路中的一环</text>
  <rect class="blue" x="60" y="100" width="170" height="78"/><text class="text" x="104" y="132">Artifacts</text><text class="muted" x="86" y="156">weights/tokenizer</text>
  <path class="arrow" d="M230 139 L280 139"/>
  <rect class="green" x="280" y="100" width="170" height="78"/><text class="text" x="314" y="132">Quantize</text><text class="muted" x="304" y="156">PTQ / FP8 / KV</text>
  <path class="arrow" d="M450 139 L500 139"/>
  <rect class="orange" x="500" y="100" width="170" height="78"/><text class="text" x="544" y="132">Runtime</text><text class="muted" x="524" y="156">vLLM/SGLang/TRT</text>
  <path class="arrow" d="M670 139 L720 139"/>
  <rect class="purple" x="720" y="100" width="170" height="78"/><text class="text" x="764" y="132">Serving</text><text class="muted" x="746" y="156">batch/cache/API</text>
  <path class="arrow" d="M890 139 L940 139"/>
  <rect class="red" x="940" y="100" width="100" height="78"/><text class="text" x="964" y="132">SLO</text><text class="muted" x="955" y="156">latency</text>
  <rect class="box" x="100" y="265" width="880" height="120"/>
  <text class="text" x="135" y="298">部署检查点</text>
  <text class="muted" x="135" y="324">模型格式、chat template、量化格式、kernel 支持、KV cache 管理、并发策略、监控和回滚。</text>
  <text class="muted" x="135" y="350">任何一环变化，都可能让 PTQ 的质量或性能结论失效。</text>
</svg>
